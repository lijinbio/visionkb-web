name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python, hygiene, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: scripts/hygiene-check.sh
      - name: Audit dependencies (PyPI packages; the two MCP packages are pinned by commit)
        run: |
          uv export --locked --no-emit-project --no-emit-package aiscientist-mcp-common \
            --no-emit-package aiscientist-mcp-visionkb-kg > requirements-audit.txt
          uvx pip-audit --strict --disable-pip -r requirements-audit.txt

  js:
    name: JavaScript (ESLint, node tests, vendored files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run vendor:check
      - name: Every module parses
        run: for f in src/visionkb_web/static/js/*.js; do node --check "$f"; done

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -rs

  browser:
    name: Browser (Playwright, Chromium headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium-headless-shell
      - run: uv run pytest -rs tests/test_browser.py tests/test_browser_layout.py
        env:
          VISIONKB_BROWSER: "1"
          VISIONKB_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-mock
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  container:
    name: Container (build + smoke test, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: visionkb-web:ci
      - name: Smoke test (read-only root; fake API and mock Anthropic on the host network)
        run: |
          sec="$RUNNER_TEMP/secrets"; mkdir -p "$sec"
          umask 022
          openssl rand -hex 16 > "$sec/api_token_read"
          openssl rand -hex 32 > "$sec/web_secret"
          code="ci-access-$(openssl rand -hex 12)"; echo "$code" > "$sec/web_access_codes"
          key="sk-ant-api03-ci$(openssl rand -hex 16)"; echo "$key" > "$sec/mock_key"
          printf 'X-Anthropic-Key: %s\n' "$key" > "$sec/key_header"
          chmod 644 "$sec"/*   # readable by the image user (uid 10001); ephemeral CI values
          uv run python -m tests.servers fake-api 18770 "$sec/api_token_read" &
          uv run python -m tests.servers mock-anthropic 18771 "$sec/mock_key" &
          docker run -d --name web --network host --read-only --tmpfs /tmp --health-interval 2s \
            -v "$sec:/run/secrets:ro" \
            -e VISIONKB_API_URL=http://127.0.0.1:18770/v1 -e VISIONKB_API_TOKEN_FILE=/run/secrets/api_token_read \
            -e VISIONKB_WEB_SECRET_FILE=/run/secrets/web_secret -e VISIONKB_WEB_ACCESS_CODES_FILE=/run/secrets/web_access_codes \
            -e VISIONKB_WEB_ANTHROPIC_BASE_URL=http://127.0.0.1:18771 -e ANTHROPIC_API_KEY=ignored-and-removed \
            visionkb-web:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8780/healthz >/dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8780/readyz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8780/readyz | tee /dev/stderr | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["status"] == "ok" and b["mcp"]["n_tools"] == 8, b
          assert b["skill"]["name"] == "answer-eye-questions-with-visionkb-kg" and b["skill"]["bytes"] == "29508", b'
          curl -fsSI http://127.0.0.1:8780/ | grep -i "^content-security-policy: default-src 'self'; script-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/api/kg/release)" = 401
          curl -fsS -c "$RUNNER_TEMP/jar" -H 'X-VisionKB-Web: 1' -H 'Content-Type: application/json' \
            --data "{\"code\": \"$code\"}" http://127.0.0.1:8780/api/session >/dev/null
          curl -fsS -b "$RUNNER_TEMP/jar" 'http://127.0.0.1:8780/api/kg/entities/search?q=RHO' | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["data"][0]["id"] == "HGNC:10012", b'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$RUNNER_TEMP/jar" http://127.0.0.1:8780/api/kg/proposals)" = 404
          curl -fsS -b "$RUNNER_TEMP/jar" -H @"$sec/key_header" http://127.0.0.1:8780/api/models | python3 -c '
          import json, sys
          b = json.load(sys.stdin)
          assert b["default_model"] == "claude-sonnet-mock-1", b'
          curl -fsS -N -b "$RUNNER_TEMP/jar" -H 'X-VisionKB-Web: 1' -H 'Content-Type: application/json' -H @"$sec/key_header" \
            --data '{"model": "claude-sonnet-mock-1", "messages": [{"role": "user", "content": "Which cell types express RHO?"}]}' \
            http://127.0.0.1:8780/api/chat > "$RUNNER_TEMP/chat.sse"
          grep -c '^event: tool_result' "$RUNNER_TEMP/chat.sse" | grep -qx 2
          grep -q '^event: done' "$RUNNER_TEMP/chat.sse"
          grep -q 'visionkb:e-0123456789abcdef' "$RUNNER_TEMP/chat.sse"
          test "$(docker run --rm visionkb-web:ci id -u)" = 10001
          for i in $(seq 1 40); do s="$(docker inspect -f '{{.State.Health.Status}}' web)"; [ "$s" = healthy ] && break; sleep 2; done
          echo "health: $s"; test "$s" = healthy
          docker logs web > "$RUNNER_TEMP/web.log" 2>&1
          if grep -F "$key" "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/chat.sse"; then echo "key leaked" >&2; exit 1; fi
          grep -q 'ignored and removed environment variables: ANTHROPIC_API_KEY' "$RUNNER_TEMP/web.log"
      - if: always()
        run: docker logs web || true
